{% extends "admin/base_admin.html" %}

{% block title %}Add New Dish | Ahaaram Admin{% endblock %}

{% block admin_content %}
  <div style="max-width: 760px; margin: 0 auto;">
    <div style="margin-bottom: 24px;">
      <a href="{{ url_for('admin_foods') }}" style="color: var(--color-gold); font-size: 0.88rem; font-weight: 600;">← Back to All Dishes</a>
      <h1 style="font-size: 2rem; margin-top: 8px;">Add New Menu Item</h1>
    </div>

    <div class="form-card">
      <form method="POST" action="{{ url_for('admin_add_food') }}">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="food_name">Dish Name *</label>
            <input type="text" name="name" id="food_name" class="form-control" placeholder="e.g. Madurai Pepper Chicken" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="food_cat">Category *</label>
            <select name="category" id="food_cat" class="form-control" required>
              {% for cat in categories %}
                <option value="{{ cat.name }}">{{ cat.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="food_price">Price (₹ INR) *</label>
            <input type="number" step="0.01" name="price" id="food_price" class="form-control" placeholder="380.00" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="veg_or_nonveg">Dietary Type *</label>
            <select name="veg_or_nonveg" id="veg_or_nonveg" class="form-control" required>
              <option value="veg">Pure Vegetarian (Green)</option>
              <option value="nonveg">Non-Vegetarian (Red)</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="food_desc">Description *</label>
          <textarea name="description" id="food_desc" rows="3" class="form-control" placeholder="Ingredients, preparation style, flavours, and accompaniments..." required></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="food_image">Image URL</label>
          <input type="url" name="image" id="food_image" class="form-control" placeholder="https://images.unsplash.com/..." value="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=600&q=80">
          <small style="color: var(--color-text-muted); font-size: 0.78rem;">Provide a valid direct image link or Unsplash food photography link.</small>
        </div>

        <div style="display: flex; gap: 24px; margin-bottom: 28px;">
          <label style="display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer;">
            <input type="checkbox" name="availability" value="1" checked>
            <span>Available for Ordering</span>
          </label>

          <label style="display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer;">
            <input type="checkbox" name="featured" value="1">
            <span>Feature as Signature Dish</span>
          </label>
        </div>

        <div style="display: flex; gap: 14px;">
          <button type="submit" class="btn btn-primary">Create Food Item</button>
          <a href="{{ url_for('admin_foods') }}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
